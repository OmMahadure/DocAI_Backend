spring.application.name=AI_Document_Processing

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/document_processing}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8081

spring.servlet.multipart.max-file-size=20MB

# Maximum size of the complete multipart request
spring.servlet.multipart.max-request-size=25MB

qdrant.host=localhost
qdrant.grpc.port=6334
qdrant.collection.name=document_chunks
qdrant.vector.size=768

app.jwt.secret=${JWT_SECRET}