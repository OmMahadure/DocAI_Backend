spring.application.name=AI_Document_Processing

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/document_processing}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

## TiDB Cloud Database Configuration
#DB_URL=jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/document_processing?sslMode=VERIFY_IDENTITY


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

spring.servlet.multipart.max-file-size=20MB

# Maximum size of the complete multipart request
spring.servlet.multipart.max-request-size=25MB

qdrant.host=${QDRANT_HOST:localhost}
qdrant.grpc.port=${QDRANT_PORT:6334}
qdrant.use.tls=${QDRANT_USE_TLS:false}
qdrant.api.key=${QDRANT_API_KEY}
qdrant.collection.name=document_chunks
qdrant.vector.size=768

app.jwt.secret=${JWT_SECRET}